<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | The Little Taco Shop</title>
    <link rel="stylesheet" href="../CSS/contact.css">
</head>
<body id="top">
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="about.html">About LTS</a></li>
                <li><a href="hours.html">Store Hours</a></li>
            </ul>
        </nav>
        <figure>
            <div id="taco-image-header">
                <img id="taco-image" src="../img/Taco.jpg" alt="Taco">
                <figcaption>Little Taco Shop Tacos</figcaption>
            </div>
        </figure>
    </header>
    <main>
        <section>
            <h2>Our Contact Form</h2>
            <form action="contact-form.php" method="post">
                    <fieldset>
                        <legend>Send Us a Message</legend>
                        <div>
                            <label for="name">Name:</label>
                            <input type="text" name="name" id="name" placeholder="Please enter your name" autocomplete="name" required>
                        </div>
                        <div>
                            <label for="email">E-mail:</label>
                            <input type="email" name="email" id="email" placeholder="Please enter your email" autocomplete="email" required>
                        </div>
                        <div>
                            <label for="message">Your Message:</label>
                            <br>
                            <textarea name="message" id="message" cols="30" rows="6" placeholder="Please enter meassage here!" required></textarea>
                        </div>
                    </fieldset>
                    <div>
                        <button type="submit">Send</button>
                        <button type="reset">Reset</button>
                    </div>
                    
            </form>
        </section>
        <section>
            <h2>Our Location</h2>
            <div>
                <address>
                    555 Taco Temptation Lane, Suite T
                    <br>
                    Kansas City, MO 55555-5555
                </address>
            </div>
            <br>
            <div>
                Phone:<a href="tel:+1 5555555555">555-555-5555</a>
            </div>
            <br>
            <div>
                <a href="#top">Back To Top</a>
            </div>
        </section>
    </main>
    <hr>
    <footer>
        <div>
            Copyright &copy; The Little Taco Shop
        </div>
        <br>
    </footer>
    

</body>
</html>
